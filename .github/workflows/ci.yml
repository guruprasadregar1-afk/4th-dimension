name: Backend CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-build:
    name: Backend Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '4 dimension project code/4th-dimension-backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd "4 dimension project code/4th-dimension-backend"
          npm ci

      - name: Run Backend Unit Tests
        run: |
          cd "4 dimension project code/4th-dimension-backend"
          npm test

      - name: Build NestJS Application
        run: |
          cd "4 dimension project code/4th-dimension-backend"
          npm run build

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: "./4 dimension project code/4th-dimension-backend"
          file: "./4 dimension project code/4th-dimension-backend/Dockerfile"
          push: false
          tags: 4th-dimension-backend:latest
