name: Standalone Engine CI & Release Workflow

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standalone Dist Artifacts
        run: npm run build

      - name: Execute Vitest Test Suite (68 Tests + JSDOM Leak Test)
        run: npm test

      - name: Verify Dist Artifact Generation
        run: ls -la dist/
